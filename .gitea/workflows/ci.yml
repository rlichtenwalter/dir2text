# dir2text CI Pipeline
#
# Runs on every push and pull request to ensure code quality.
# Uses uv for dependency management and task orchestration.
#
# Gitea Actions is compatible with GitHub Actions syntax.
# See: https://docs.gitea.com/usage/actions/overview

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Quality (pre-commit run --all-files at both stages)
  # ==========================================================================
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install uv + pre-commit
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Install dev + all extras (needed for make test invoked by pre-push hook)
        run: uv sync --group dev --extra all
      # SKIP no-commit-to-branch: that hook guards local commits to protected
      # branches; in CI it fires spuriously whenever the workflow checks out
      # main.
      - run: uvx --with pre-commit==4.5.1 pre-commit run --all-files --hook-stage pre-commit
        env:
          SKIP: no-commit-to-branch
      - run: uvx --with pre-commit==4.5.1 pre-commit run --all-files --hook-stage pre-push
        env:
          SKIP: no-commit-to-branch

  # ==========================================================================
  # Lint & Format Check
  # ==========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev --extra all

      - name: Run ruff linter
        run: uv run ruff check src/ tests/

      - name: Check formatting
        run: uv run ruff format --check src/ tests/

  # ==========================================================================
  # Type Check
  # ==========================================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev --extra all

      - name: Run pyright
        run: uv run pyright src/

  # ==========================================================================
  # Test Matrix
  # ==========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev --extra all

      - name: Run tests
        run: uv run pytest tests/ -v

  # ==========================================================================
  # Build Check
  # ==========================================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Build package
        run: uv build

      - name: Verify wheel
        run: |
          python -m venv verify-venv
          verify-venv/bin/pip install dist/dir2text-*.whl
          verify-venv/bin/python -c "import dir2text; print(f'dir2text version: {dir2text.__version__}')"

  # ==========================================================================
  # Secret scan (tree). The commit-stage gitleaks hook runs
  # `gitleaks git --staged`, and nothing is staged on a clean CI checkout --
  # it scans zero bytes and exits 0, so it is NOT a backstop for a commit made
  # with hooks bypassed. This scans the working tree instead. Run from the
  # repository root: in `dir` mode gitleaks reports File exactly as given, so
  # `dir .` keeps paths repo-relative and a `paths` allowlist anchored `^...`
  # keeps matching. Version tracks .pre-commit-config.yaml's gitleaks rev and
  # is checksum-pinned (sha256 from upstream's checksums file) before extract.
  # ==========================================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the tree for secrets
        run: gitleaks dir . --redact --no-banner
